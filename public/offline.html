<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>WearNext — Offline</title
  ><style>
    body {
      font: 18px system-ui;
      background: #f5f7f5;
      color: #1e2b28;
      max-width: 420px;
      margin: 15vh auto;
      padding: 30px;
    }
    h1 {
      font-size: 30px;
      letter-spacing: -1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      background: #27594f;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 10px;
      font: inherit;
    }
  </style>
  <h1>
    <svg
      aria-hidden="true"
      width="36"
      height="36"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 64 64"
    >
      <rect width="64" height="64" rx="16" fill="#27594f" />
      <path
        d="M15 23 23 43 32 27 41 43 50 19"
        fill="none"
        stroke="#fff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    wearnext
  </h1>
  <h2>You’re offline.</h2>
  <p>
    Reconnect to load your clothes and save changes. Your wardrobe stays in your
    account.
  </p>
  <button onclick="location.reload()">Try again</button>
</html>
